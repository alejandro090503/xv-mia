<svg xmlns="http://www.w3.org/2000/svg" width="200" height="126" viewBox="0 0 200 126">
  <defs>
    <linearGradient id="tIce" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#f0faff"/>
      <stop offset="62%" stop-color="#cbe9ff"/>
      <stop offset="100%" stop-color="#8fbde8"/>
    </linearGradient>
    <linearGradient id="tIceSoft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset="100%" stop-color="#bfe0fa" stop-opacity=".5"/>
    </linearGradient>
    <linearGradient id="tGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5e7bd"/>
      <stop offset="45%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#eddaa4"/>
    </linearGradient>
  </defs>

  <!-- cuerpo de cristal -->
  <path d="M14 98L20 58L35 78.1L50 34L75 80.5L100 14L125 80.5L150 34L165 78.1L180 58L186 98Z"
        fill="url(#tIce)" stroke="#ffffff" stroke-width="2" stroke-linejoin="round" opacity=".97"/>
  <!-- facetas internas: dan volumen de hielo tallado -->
  <g stroke="#ffffff" stroke-width="1.5" fill="none" opacity=".8" stroke-linecap="round">
    <path d="M100 14L100 84M50 34L50 86M150 34L150 86M20 58L20 92M180 58L180 92"/>
  </g>
  <g fill="url(#tIceSoft)" opacity=".75">
    <path d="M100 14L112 62L100 84L88 62Z"/>
    <path d="M50 34L60 68L50 86L40 68Z"/>
    <path d="M150 34L160 68L150 86L140 68Z"/>
  </g>

  <!-- arco base -->
  <path d="M12 98Q100 122 188 98" fill="none" stroke="url(#tGold)" stroke-width="3" stroke-linecap="round"/>
  <path d="M12 103Q100 127 188 103" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" opacity=".85"/>

  <!-- gemas de hielo en las puntas -->
  <g stroke="url(#tGold)" stroke-width="1.4">
    <circle cx="100" cy="14" r="5.2" fill="#ffffff"/>
    <circle cx="50" cy="34" r="4" fill="#eaf7ff"/>
    <circle cx="150" cy="34" r="4" fill="#eaf7ff"/>
    <circle cx="20" cy="58" r="3.2" fill="#eaf7ff"/>
    <circle cx="180" cy="58" r="3.2" fill="#eaf7ff"/>
  </g>

  <!-- destellos -->
  <g stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity=".95">
    <path d="M100 4v6M100 20v5M92 14h5M105 14h5"/>
    <path d="M50 25v4M46 34h3M53 34h3"/>
    <path d="M150 25v4M146 34h3M153 34h3"/>
  </g>
</svg>
